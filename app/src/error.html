<!doctype html>
<html translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.error.message%</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f4efe6;
				color: #1c222a;
				font-family: system-ui, sans-serif;
				text-align: center;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #13171d;
					color: #e8e4dc;
				}
			}
			h1 {
				font-size: 40px;
				margin: 0 0 12px;
			}
			p {
				font-size: 20px;
				margin: 0 0 24px;
				opacity: 0.75;
			}
			a {
				color: inherit;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>%sveltekit.error.message%</h1>
			<p>Błąd · Fehler · Error %sveltekit.status%</p>
			<a href="/">← Kalendarz · Kalender · Calendar</a>
		</main>
	</body>
</html>
